<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espforge (no Wi-Fi) – Try it</title>
<meta name="description" content="The no-Wi-Fi starter's own screens, running in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23000' stroke='%23384452' stroke-width='3'/%3E%3C/svg%3E">
<!-- The display in the browser (web/emu/README.md at the top of the repository): this page is the app's; the
     framework's emu-page.js runs the display. An app with no Wi-Fi has no settings page, so no frame for it. -->
<style>
  @font-face { font-family: "Montserrat"; src: url(fonts/montserrat.ttf) format("truetype"); font-display: swap; }
  :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6675; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11141a; --fg: #e6e9ef; --muted: #9aa3b2; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0; }
  .muted { color: var(--muted); }
  .device { width: 100%; max-width: 440px; aspect-ratio: 1; border-radius: 50%; padding: 4%; background: #20252d;
            margin: 24px auto 0; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 60px -30px #000; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 50%; background: #000; touch-action: none;
           cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status { min-height: 1.5em; text-align: center; margin: 12px 0 0; }
  .how { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .how b { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Try it in your browser</h1>
  <p class="muted">The no-Wi-Fi starter's own code and screens, running here. Use the mouse, or your finger on a phone,
    as you would on the display.</p>
  <div class="device"><canvas id="screen" width="466" height="466"
    aria-label="The display's screen. Drag, tap or press and hold on it."></canvas></div>
  <p id="status" class="muted" data-error="The display could not start:">Starting…</p>
  <ul class="how">
    <li><b>Drag sideways</b>: the hello and system pages</li>
    <li><b>Press and hold</b>: Settings (screen dimming, language, restart, about)</li>
  </ul>
</main>
<script src="emu.js"></script>
<script src="emu-page.js"></script>
</body>
</html>
